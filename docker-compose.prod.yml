services:
  backend:
    image: ${IMAGE_REGISTRY:-192.168.100.165:3000/jakub}/savings-planner-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${DB_HOST:-192.168.100.164}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-finance}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      API_TOKEN: ${API_TOKEN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://savings.lan}
      INTERNAL_TRANSFER_SOURCE_ACCOUNTS: ${INTERNAL_TRANSFER_SOURCE_ACCOUNTS:-}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://192.168.100.7:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen3:14b}
      LLM_MIN_CONFIDENCE: ${LLM_MIN_CONFIDENCE:-0.70}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - savings

  frontend:
    image: ${IMAGE_REGISTRY:-192.168.100.165:3000/jakub}/savings-planner-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_TOKEN: ${API_TOKEN}
    ports:
      - "80:80"
    networks:
      - savings

networks:
  savings:
    name: savings-planner
