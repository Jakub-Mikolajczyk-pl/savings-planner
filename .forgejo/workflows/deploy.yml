name: Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: 192.168.100.165:3000
  REGISTRY_NAMESPACE: jakub
  FRONTEND_IMAGE: savings-planner-frontend
  BACKEND_IMAGE: savings-planner-backend
  DEPLOY_HOST: 192.168.100.166
  DEPLOY_USER: deploy
  DEPLOY_DIR: /opt/savings-planner
  SSH_OPTS: -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts

jobs:
  build-push-deploy:
    name: Build, push, deploy to CT111
    runs-on: host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        run: |
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          echo "sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend=${REGISTRY}/${REGISTRY_NAMESPACE}/${BACKEND_IMAGE}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend=${REGISTRY}/${REGISTRY_NAMESPACE}/${FRONTEND_IMAGE}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to Forgejo registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "${REGISTRY}" --username "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build backend image
        run: |
          docker build \
            --tag "${{ steps.meta.outputs.backend }}" \
            --tag "${REGISTRY}/${REGISTRY_NAMESPACE}/${BACKEND_IMAGE}:latest" \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_BACKEND=api \
            --build-arg VITE_API_BASE_URL= \
            --tag "${{ steps.meta.outputs.frontend }}" \
            --tag "${REGISTRY}/${REGISTRY_NAMESPACE}/${FRONTEND_IMAGE}:latest" \
            .

      - name: Push images
        run: |
          docker push "${{ steps.meta.outputs.backend }}"
          docker push "${REGISTRY}/${REGISTRY_NAMESPACE}/${BACKEND_IMAGE}:latest"
          docker push "${{ steps.meta.outputs.frontend }}"
          docker push "${REGISTRY}/${REGISTRY_NAMESPACE}/${FRONTEND_IMAGE}:latest"

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CT111_SSH_KEY }}" > ~/.ssh/ct111
          chmod 600 ~/.ssh/ct111
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Copy compose file
        run: |
          ssh -i ~/.ssh/ct111 ${SSH_OPTS} "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p ${DEPLOY_DIR}"
          scp -i ~/.ssh/ct111 ${SSH_OPTS} docker-compose.prod.yml "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_DIR}/docker-compose.prod.yml"

      - name: Deploy on CT111
        run: |
          ssh -i ~/.ssh/ct111 ${SSH_OPTS} "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd ${DEPLOY_DIR} && IMAGE_REGISTRY=${REGISTRY}/${REGISTRY_NAMESPACE} IMAGE_TAG=${{ steps.meta.outputs.sha }} docker compose -f docker-compose.prod.yml pull && IMAGE_REGISTRY=${REGISTRY}/${REGISTRY_NAMESPACE} IMAGE_TAG=${{ steps.meta.outputs.sha }} docker compose -f docker-compose.prod.yml up -d --remove-orphans"

      - name: Notify with human-verify checklist
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TG_TOKEN}" ] || [ -z "${TG_CHAT}" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret is empty — check secret scope (repo or user level)" >&2
            exit 1
          fi
          # Derive epic slug from the commit subject, e.g. "epic-14-koszyk-inflacyjny"
          SLUG=$(git log -1 --pretty=%s | grep -oE 'epic-[0-9]+[a-z0-9-]*' | head -n1 || true)
          FILE=""
          if [ -n "$SLUG" ]; then
            N=$(echo "$SLUG" | grep -oE '[0-9]+' | head -n1)
            FILE=$(ls docs/planning/EPIC-${N}*.md 2>/dev/null | head -n1 || true)
          fi
          if [ -n "$FILE" ] && grep -q 'HUMAN-VERIFY:START' "$FILE"; then
            BLOCK=$(sed -n '/HUMAN-VERIFY:START/,/HUMAN-VERIFY:END/p' "$FILE" | grep -v 'HUMAN-VERIFY:')
            MSG=$(printf '✅ <b>%s</b> deployed on savings.lan\n\n%s' "${SLUG:-app}" "$BLOCK")
          else
            MSG=$(printf '⚠️ <b>%s</b> deployed on savings.lan — NO human-verify checklist found (%s)' \
                  "${SLUG:-app}" "${FILE:-no matching handover}")
          fi
          RESPONSE=$(curl -s -w '\n%{http_code}' -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d parse_mode="HTML" \
            --data-urlencode text="$MSG")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Telegram API returned HTTP ${HTTP_CODE}: ${BODY}" >&2
            exit 1
          fi
          echo "Telegram notified (HTTP 200)"
